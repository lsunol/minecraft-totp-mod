# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Fabric versions - verified against https://fabricmc.net/develop for Minecraft 1.21.11
#   minecraft : stable game version (meta.fabricmc.net/v2/versions/game)
#   loader    : latest stable Fabric Loader
#   loom      : latest stable Fabric Loom 1.x
#   fabric    : latest Fabric API build for 1.21.11
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.16.3
fabric_version=0.141.4+1.21.11

# Mod properties
mod_version=1.0.0
maven_group=cat.lluissunol
archives_base_name=totpauth

# Bundled libraries (Jar-in-Jar). Not mods - plain libraries wrapped by Loom's include().
javaotp_version=0.4.0
commonscodec_version=1.18.0
# QR-code generation for the enrollment setup (rendered as ASCII in chat).
zxing_version=3.5.3
